name: Build ESP32 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone Dependencies Manually
      run: |
        # Clone the broken board support package
        rm -rf components/esp32_s3_touch_amoled_2_06
        git clone https://github.com/joaquimorg/esp32_s3_touch_amoled_2_06.git components/esp32_s3_touch_amoled_2_06
        
        # Clone the missing UI Framework WITH internal submodules!
        rm -rf esp-brookesia
        git clone --recursive https://github.com/espressif/esp-brookesia.git esp-brookesia

    - name: Remove Outdated Lock File
      run: |
        rm -f dependencies.lock

    - name: Correct Hardcoded Windows Paths
      shell: python
      run: |
        import os
        import glob

        # Get the current Linux runner workspace path
        workspace = os.environ['GITHUB_WORKSPACE'].replace('\\', '/')
        win_path1 = 'D:/Work/ESP32-S3-Touch-AMOLED'
        win_path2 = 'D:\\Work\\ESP32-S3-Touch-AMOLED'

        # Safely find and replace the Windows path in all manifest files
        for filepath in glob.glob('**/idf_component.yml', recursive=True):
            with open(filepath, 'r', encoding='utf-8') as f:
                content = f.read()
            
            modified = False
            if win_path1 in content:
                content = content.replace(win_path1, workspace)
                modified = True
            if win_path2 in content:
                content = content.replace(win_path2, workspace)
                modified = True
                
            if modified:
                with open(filepath, 'w', encoding='utf-8') as f:
                    f.write(content)
                print(f"Fixed absolute Windows path in: {filepath}")

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3.1
        target: esp32s3
        path: '.'

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-firmware-binaries
        path: |
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/*.bin
