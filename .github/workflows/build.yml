name: Build ESP32 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone Submodule Manually
      run: |
        rm -rf components/esp32_s3_touch_amoled_2_06
        git clone https://github.com/joaquimorg/esp32_s3_touch_amoled_2_06.git components/esp32_s3_touch_amoled_2_06

    - name: Remove Outdated Lock File
      run: |
        rm -f dependencies.lock

    - name: Correct Manifest Files
      shell: python
      run: |
        import os
        import re

        manifest_path = 'main/idf_component.yml'
        if os.path.exists(manifest_path):
            with open(manifest_path, 'r') as f:
                lines = f.readlines()
            
            new_lines = []
            for line in lines:
                if 'override_path' in line:
                    # If this is one of our local apps in components/apps/, make it relative
                    if 'components/apps/' in line:
                        new_line = re.sub(
                            r'override_path:\s*["\']?.*?/components/apps/([^"\']+)["\']?',
                            r'path: "../components/apps/\1"',
                            line
                        )
                        new_line = re.sub(
                            r'override_path:\s*["\']?.*?\\components\\apps\\([^"\']+)["\']?',
                            r'path: "../components/apps/\1"',
                            new_line
                        )
                        new_lines.append(new_line)
                    else:
                        # Otherwise (e.g. brookesia_core), discard the line so it downloads from the registry
                        pass
                else:
                    new_lines.append(line)
                    
            with open(manifest_path, 'w') as f:
                f.writelines(new_lines)
            
            # Print the output for verification in workflow logs
            with open(manifest_path, 'r') as f:
                print("Successfully updated main/idf_component.yml:")
                print(f.read())

        # For any other idf_component.yml files in subdirectories, clean out override_path entirely
        for root, dirs, files in os.walk('.'):
            if root == './main' or root == 'main':
                continue
            for file in files:
                if file == 'idf_component.yml':
                    filepath = os.path.join(root, file)
                    with open(filepath, 'r') as f:
                        lines = f.readlines()
                    new_lines = [line for line in lines if 'override_path' not in line]
                    with open(filepath, 'w') as f:
                        f.writelines(new_lines)
                    print(f"Cleaned override_path from: {filepath}")

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3.1
        target: esp32s3
        path: '.'

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-firmware-binaries
        path: |
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/*.bin
