name: Build ESP32 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone Dependencies Manually
      run: |
        # Clone the broken board support package
        rm -rf components/esp32_s3_touch_amoled_2_06
        git clone https://github.com/joaquimorg/esp32_s3_touch_amoled_2_06.git components/esp32_s3_touch_amoled_2_06
        
        # Clone the missing UI Framework
        rm -rf esp-brookesia
        git clone https://github.com/espressif/esp-brookesia.git esp-brookesia

    - name: Remove Outdated Lock File
      run: |
        rm -f dependencies.lock

    - name: Correct Manifest Files
      shell: python
      run: |
        import os

        manifest_path = 'main/idf_component.yml'
        if os.path.exists(manifest_path):
            with open(manifest_path, 'r') as f:
                lines = f.readlines()
            
            new_lines = []
            for line in lines:
                if 'override_path' in line:
                    normalized = line.replace('\\', '/')
                    # Map local smartwatch apps to relative paths
                    if 'components/apps/' in normalized:
                        app_name = normalized.split('components/apps/')[-1].strip().strip('"').strip("'")
                        new_lines.append(f'    path: "../components/apps/{app_name}"\n')
                    # Map the missing UI framework to the newly cloned repository folder
                    elif 'brookesia_core' in normalized:
                        new_lines.append('    path: "../esp-brookesia/core/brookesia_core"\n')
                    # Strip any other absolute paths
                    else:
                        pass
                else:
                    new_lines.append(line)
                    
            with open(manifest_path, 'w') as f:
                f.writelines(new_lines)
            
            with open(manifest_path, 'r') as f:
                print("Successfully mapped paths in main/idf_component.yml:")
                print(f.read())

        # Clean out absolute paths from internal sub-components
        for root, dirs, files in os.walk('.'):
            if root == '.' or './main' in root or 'main' in root:
                continue
            for file in files:
                if file == 'idf_component.yml':
                    filepath = os.path.join(root, file)
                    with open(filepath, 'r') as f:
                        lines = f.readlines()
                    new_lines = [line for line in lines if 'override_path' not in line]
                    with open(filepath, 'w') as f:
                        f.writelines(new_lines)
                    print(f"Cleaned absolute paths from: {filepath}")

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3.1
        target: esp32s3
        path: '.'

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-firmware-binaries
        path: |
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/*.bin
