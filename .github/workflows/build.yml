name: Build ESP32 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone Dependencies Manually
      run: |
        # Clone only the custom board support package (BSP)
        rm -rf components/esp32_s3_touch_amoled_2_06
        git clone https://github.com/joaquimorg/esp32_s3_touch_amoled_2_06.git components/esp32_s3_touch_amoled_2_06

    - name: Install Python PyYAML
      run: pip install pyyaml

    - name: Remove Outdated Lock File
      run: |
        rm -f dependencies.lock

    - name: Perform Code and Manifest Repairs
      shell: python
      run: |
        import os
        import re
        import yaml

        # 1. Remove the calculator app from C++ source
        main_cpp = 'main.cpp'
        if os.path.exists(main_cpp):
            with open(main_cpp, 'r', encoding='utf-8') as f:
                cpp_code = f.read()
            
            cpp_code = cpp_code.replace('"Calculator", ', '')
            cpp_code = cpp_code.replace(', "Calculator"', '')
            cpp_code = cpp_code.replace('"Calculator"', '')
            
            with open(main_cpp, 'w', encoding='utf-8') as f:
                f.write(cpp_code)
            print("Removed Calculator from main.cpp")

        # 2. Replace boost thread usage with standard C++ std::thread
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file.endswith('.cpp') or file.endswith('.h') or file.endswith('.hpp'):
                    filepath = os.path.join(root, file)
                    try:
                        with open(filepath, 'r', encoding='utf-8') as f:
                            content = f.read()
                    except UnicodeDecodeError:
                        continue
                        
                    if 'boost::thread' in content or 'boost::this_thread' in content:
                        content = content.replace('boost::thread', 'std::thread')
                        content = content.replace('boost::this_thread::sleep_for', 'std::this_thread::sleep_for')
                        content = content.replace('boost::chrono', 'std::chrono')
                        if '#include <thread>' not in content and file.endswith('.cpp'):
                            content = '#include <thread>\n' + content
                            
                        with open(filepath, 'w', encoding='utf-8') as f:
                            f.write(content)
                        print(f"Replaced boost::thread with std::thread in {filepath}")

        # 3. Clean up components and fix registry dependencies
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file == 'idf_component.yml':
                    filepath = os.path.join(root, file)
                    with open(filepath, 'r', encoding='utf-8') as f:
                        try:
                            data = yaml.safe_load(f)
                        except Exception as e:
                            print(f"Error parsing {filepath}: {e}")
                            continue
                    
                    if not data or 'dependencies' not in data:
                        continue
                        
                    dependencies = data['dependencies']
                    modified = False
                    
                    # Remove calculator app
                    for key in list(dependencies.keys()):
                        if 'brookesia_app_calculator' in key:
                            dependencies.pop(key)
                            modified = True
                    
                    # Replace custom brookesia_core with official esp-brookesia v0.4.0 (for LVGL 8 / user namespaces)
                    keys_to_remove = []
                    for key in list(dependencies.keys()):
                        if key in ['brookesia_core', 'espressif/brookesia_core']:
                            keys_to_remove.append(key)
                    
                    if keys_to_remove:
                        for key in keys_to_remove:
                            dependencies.pop(key)
                        dependencies['espressif/esp-brookesia'] = '~0.4.0'
                        modified = True
                    
                    # Ensure esp-lib-utils is explicitly downloaded since v0.4.0 doesn't bundle it automatically
                    if 'main/idf_component.yml' in filepath or filepath.endswith('main/idf_component.yml'):
                        dependencies['espressif/esp-lib-utils'] = '^0.2.0'
                        modified = True
                    
                    # Maintain LVGL configuration but allow the registry to auto-resolve matching version (*)
                    for dep_name in ['espressif/esp_lvgl_port', 'lvgl/lvgl', 'lvgl']:
                        if dep_name in dependencies:
                            if isinstance(dependencies[dep_name], dict):
                                dependencies[dep_name]['version'] = "*"
                                for pk in ['path', 'override_path']:
                                    if pk in dependencies[dep_name]:
                                        dependencies[dep_name].pop(pk)
                            else:
                                dependencies[dep_name] = "*"
                            modified = True
                    
                    if modified:
                        with open(filepath, 'w', encoding='utf-8') as f:
                            yaml.dump(data, f, default_flow_style=False, sort_keys=False)
                        print(f"Updated {filepath}")

        # 4. Repair CMakeLists.txt and FORCE missing REQUIRES headers
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file == 'CMakeLists.txt':
                    filepath = os.path.join(root, file)
                    with open(filepath, 'r', encoding='utf-8') as f:
                        content = f.read()
                    
                    original_content = content
                    content = content.replace('espressif__brookesia_core', 'espressif__esp-brookesia')
                    content = content.replace('brookesia_core', 'esp-brookesia')
                    
                    if 'idf_component_register' in content and 'REQUIRES' in content:
                        if any(x in filepath for x in ['esp32_s3_touch_amoled', 'display_manager', 'bsp_extra']):
                            if 'lvgl__lvgl' not in content:
                                content = re.sub(r'\bREQUIRES\b', 'REQUIRES lvgl__lvgl espressif__esp_lvgl_port ', content)
                        
                        # Fix app_notifications requirements to link downloaded esp-lib-utils
                        if 'app_notifications' in filepath:
                            if 'espressif__esp-lib-utils' not in content:
                                content = re.sub(r'\bREQUIRES\b', 'REQUIRES espressif__esp-lib-utils ', content)
                    
                    if content != original_content:
                        with open(filepath, 'w', encoding='utf-8') as f:
                            f.write(content)
                        print(f"Repaired REQUIRES in {filepath}")

        # 5. Fix board support package (BSP) powerdown structure error
        bsp_source = 'components/esp32_s3_touch_amoled_2_06/esp32_s3_touch_amoled_2_06.c'
        if os.path.exists(bsp_source):
            with open(bsp_source, 'r', encoding='utf-8') as f:
                content = f.read()
            
            original_content = content
            content = re.sub(r'\.allow_pd\s*=\s*[^,\n]*,?', '', content)
            content = content.replace('CONFIG_I2C_MASTER_FREQUENCY', '400000')
            
            if content != original_content:
                with open(bsp_source, 'w', encoding='utf-8') as f:
                    f.write(content)
                print(f"Repaired {bsp_source}")

        # 6. Repair obsolete header inclusions in dark/core_data.h
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file.endswith('.h') or file.endswith('.hpp') or file.endswith('.cpp'):
                    filepath = os.path.join(root, file)
                    try:
                        with open(filepath, 'r', encoding='utf-8') as f:
                            content = f.read()
                    except UnicodeDecodeError:
                        continue
                        
                    modified = False
                    if 'systems/base/esp_brookesia_base_context.hpp' in content:
                        content = content.replace('systems/base/esp_brookesia_base_context.hpp', 'esp_brookesia.hpp')
                        modified = True
                    if 'systems/base/esp_brookesia_base_type.hpp' in content:
                        content = content.replace('systems/base/esp_brookesia_base_type.hpp', 'esp_brookesia.hpp')
                        modified = True
                    if 'systems/base/esp_brookesia_base_app.hpp' in content:
                        content = content.replace('systems/base/esp_brookesia_base_app.hpp', 'esp_brookesia.hpp')
                        modified = True
                        
                    if modified:
                        with open(filepath, 'w', encoding='utf-8') as f:
                            f.write(content)
                        print(f"Fixed legacy include in {filepath}")

        # 7. Inject C++ backward-compatibility aliases directly into local custom files to avoid compile-order issues
        compat_block = """
        #ifndef ESP_BROOKESIA_COMPAT_HPP
        #define ESP_BROOKESIA_COMPAT_HPP
        namespace esp_brookesia {
            namespace systems {
                namespace phone {
                    using App = ::esp_brookesia::ESP_Brookesia_PhoneApp;
                    using Phone = ::esp_brookesia::ESP_Brookesia_Phone;
                    using PhoneHome = ::esp_brookesia::ESP_Brookesia_PhoneHome;
                    using PhoneManager = ::esp_brookesia::ESP_Brookesia_PhoneManager;
                }
                namespace base {
                    using App = ::esp_brookesia::ESP_Brookesia_App;
                    using Context = ::esp_brookesia::ESP_Brookesia_Core;
                    using Display = ::esp_brookesia::ESP_Brookesia_CoreDisplay;
                    using Manager = ::esp_brookesia::ESP_Brookesia_CoreManager;
                }
            }
            namespace gui {
            }
            using AppLauncherIcon = ::esp_brookesia::ESP_Brookesia_AppLauncherIcon;
            using AppLauncher = ::esp_brookesia::ESP_Brookesia_AppLauncher;
            using RecentsScreenSnapshot = ::esp_brookesia::ESP_Brookesia_RecentsScreenSnapshot;
            using RecentsScreen = ::esp_brookesia::ESP_Brookesia_RecentsScreen;
            using Gesture = ::esp_brookesia::ESP_Brookesia_Gesture;
            using NavigationBar = ::esp_brookesia::ESP_Brookesia_NavigationBar;
            using StatusBar = ::esp_brookesia::ESP_Brookesia_StatusBar;
            using Display = ::esp_brookesia::ESP_Brookesia_CoreDisplay;
            using Manager = ::esp_brookesia::ESP_Brookesia_CoreManager;
            using Stylesheet = ::esp_brookesia::ESP_Brookesia_CoreStylesheet;
            using LvLock = ::esp_brookesia::ESP_Brookesia_LvLock;
            using LvLockGuard = ::esp_brookesia::ESP_Brookesia_LvLockGuard;
        }
        #endif
        """
        for root, dirs, files in os.walk('.'):
            # Skip framework and build files so aliases only apply locally
            if 'managed_components' in root or 'build' in root:
                continue
            for file in files:
                if file.endswith('.h') or file.endswith('.hpp') or file.endswith('.cpp'):
                    filepath = os.path.join(root, file)
                    try:
                        with open(filepath, 'r', encoding='utf-8') as f:
                            content = f.read()
                    except UnicodeDecodeError:
                        continue
                        
                    # Target only custom files referencing the legacy structures
                    if 'systems::phone' in content or 'systems::base' in content or 'esp_brookesia::gui' in content or 'LvLock' in content or 'Stylesheet' in content:
                        if 'ESP_BROOKESIA_COMPAT_HPP' not in content:
                            content += '\n' + compat_block + '\n'
                            with open(filepath, 'w', encoding='utf-8') as f:
                                f.write(content)
                            print(f"Injected compatibility mapping into {filepath}")

        # 8. Dynamically patch esp-brookesia mismatched-new-delete bug during CMake execution
        root_cmake = 'CMakeLists.txt'
        if os.path.exists(root_cmake):
            with open(root_cmake, 'r') as f:
                content = f.read()
            
            if 'mismatched-new-delete' not in content:
                # The content inside this multiline string is correctly indented to satisfy YAML parser formatting
                injection = """
                # Run dynamically to fix esp-brookesia memory deallocation bug for GCC 13 after download
                execute_process(COMMAND sed -i "s/free(anim);/delete anim;/g" ${CMAKE_SOURCE_DIR}/managed_components/espressif__esp-brookesia/src/core/esp_brookesia_lv.hpp ERROR_QUIET)

                # Also formally suppress the warning as a fallback (limited to CXX compiler so C files do not warn)
                if(TARGET __idf_espressif__esp-brookesia)
                    target_compile_options(__idf_espressif__esp-brookesia PRIVATE "$<$<COMPILE_LANGUAGE:CXX>:-Wno-error=mismatched-new-delete>" "$<$<COMPILE_LANGUAGE:CXX>:-Wno-mismatched-new-delete>")
                endif()
                """
                # Insert right after project() is fully resolved
                content = re.sub(r'(project\([^\)]+\))', r'\1' + injection, content)
                with open(root_cmake, 'w') as f:
                    f.write(content)
                print("Injected dynamic patch commands into root CMakeLists.txt")

        # 9. Convert potential LVGL 9 image assets back to LVGL 8 structures (Fixes notifications asset)
        for root, dirs, files in os.walk('components/apps'):
            for file in files:
                if file.endswith('.c') or file.endswith('.h'):
                    filepath = os.path.join(root, file)
                    try:
                        with open(filepath, 'r', encoding='utf-8') as f:
                            content = f.read()
                    except UnicodeDecodeError:
                        continue
                        
                    if 'lv_image_dsc_t' in content or 'LV_COLOR_FORMAT_ARGB8888' in content:
                        content = content.replace('lv_image_dsc_t', 'lv_img_dsc_t')
                        content = content.replace('LV_COLOR_FORMAT_ARGB8888', 'LV_IMG_CF_TRUE_COLOR_ALPHA')
                        content = re.sub(r'\.header\.magic\s*=\s*[^,\n]*,?', '', content)
                        
                        with open(filepath, 'w', encoding='utf-8') as f:
                            f.write(content)
                        print(f"Converted asset {filepath} to LVGL 8 structure")

    - name: Clean up Calculator Component Directory
      run: rm -rf components/apps/brookesia_app_calculator

    - name: Ensure SPIFFS Directory Exists
      run: mkdir -p spiffs

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3.2
        target: esp32s3
        path: '.'

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-firmware-binaries
        path: |
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/*.bin
