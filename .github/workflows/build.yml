name: Build ESP32 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone Dependencies Manually
      run: |
        # Clone only the custom board support package (BSP)
        rm -rf components/esp32_s3_touch_amoled_2_06
        git clone https://github.com/joaquimorg/esp32_s3_touch_amoled_2_06.git components/esp32_s3_touch_amoled_2_06

    - name: Install Python PyYAML
      run: pip install pyyaml

    - name: Remove Outdated Lock File
      run: |
        rm -f dependencies.lock

    - name: Perform Code and Manifest Repairs
      shell: python
      run: |
        import os
        import re
        import yaml

        # 1. Remove the calculator app from C++ source
        main_cpp = 'main.cpp'
        if os.path.exists(main_cpp):
            with open(main_cpp, 'r', encoding='utf-8') as f:
                cpp_code = f.read()
            
            # Remove "Calculator" from the ordered_app_names vector
            cpp_code = cpp_code.replace('"Calculator", ', '')
            cpp_code = cpp_code.replace(', "Calculator"', '')
            cpp_code = cpp_code.replace('"Calculator"', '')
            
            with open(main_cpp, 'w', encoding='utf-8') as f:
                f.write(cpp_code)
            print("Removed Calculator from main.cpp")

        # 2. Remove the calculator dependency from the main manifest
        main_manifest = 'main/idf_component.yml'
        if os.path.exists(main_manifest):
            with open(main_manifest, 'r', encoding='utf-8') as f:
                lines = f.readlines()
            
            new_lines = []
            skip = False
            for line in lines:
                if line.strip().startswith('brookesia_app_calculator'):
                    skip = True
                    continue
                if skip:
                    if line.startswith('  ') or line.strip() == '':
                        continue
                    else:
                        skip = False
                if not skip:
                    new_lines.append(line)
                    
            with open(main_manifest, 'w', encoding='utf-8') as f:
                f.writelines(new_lines)
            print("Removed Calculator from main/idf_component.yml")

        # 3. Transition from custom brookesia_core to official espressif/esp-brookesia component
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file == 'idf_component.yml':
                    filepath = os.path.join(root, file)
                    with open(filepath, 'r', encoding='utf-8') as f:
                        try:
                            data = yaml.safe_load(f)
                        except Exception as e:
                            print(f"Error parsing {filepath}: {e}")
                            continue
                    
                    if not data or 'dependencies' not in data:
                        continue
                        
                    dependencies = data['dependencies']
                    modified = False
                    
                    # Identify obsolete brookesia_core references
                    keys_to_remove = []
                    for key in list(dependencies.keys()):
                        if key in ['brookesia_core', 'espressif/brookesia_core']:
                            keys_to_remove.append(key)
                    
                    if keys_to_remove:
                        for key in keys_to_remove:
                            dependencies.pop(key)
                        
                        # Add the clean registry-backed esp-brookesia package (version >= 0.5.0 which supports LVGL 9.2)
                        dependencies['espressif/esp-brookesia'] = '^0.5.0'
                        modified = True
                    
                    # Lock espressif/esp_lvgl_port to ~2.3.0 to preserve compatibility with LVGL 9.2
                    if 'espressif/esp_lvgl_port' in dependencies:
                        dep_info = dependencies['espressif/esp_lvgl_port']
                        if isinstance(dep_info, dict):
                            dep_info['version'] = '~2.3.0'
                        else:
                            dependencies['espressif/esp_lvgl_port'] = '~2.3.0'
                        modified = True
                        
                    # Clean up other local override paths that are broken
                    for dep_name, dep_info in list(dependencies.items()):
                        if isinstance(dep_info, dict):
                            for path_key in ['path', 'override_path']:
                                if path_key in dep_info:
                                    path_val = dep_info[path_key]
                                    path_val_norm = path_val.replace('\\', '/')
                                    if os.path.isabs(path_val_norm):
                                        full_path = path_val_norm
                                    else:
                                        full_path = os.path.abspath(os.path.join(root, path_val_norm))
                                    
                                    if not os.path.isdir(full_path):
                                        print(f"[{filepath}] Removing broken {path_key} for {dep_name}: {path_val}")
                                        dep_info.pop(path_key)
                                        modified = True
                                    else:
                                        if dep_info[path_key] != path_val_norm:
                                            dep_info[path_key] = path_val_norm
                                            modified = True
                    
                    if modified:
                        with open(filepath, 'w', encoding='utf-8') as f:
                            yaml.dump(data, f, default_flow_style=False, sort_keys=False)
                        print(f"Transitioned manifest {filepath} to official espressif/esp-brookesia component")

        # 4. Update CMakeLists.txt to require esp-brookesia instead of brookesia_core
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file == 'CMakeLists.txt':
                    filepath = os.path.join(root, file)
                    with open(filepath, 'r', encoding='utf-8') as f:
                        content = f.read()
                    
                    original_content = content
                    content = content.replace('espressif__brookesia_core', 'espressif__esp-brookesia')
                    content = content.replace('brookesia_core', 'esp-brookesia')
                    
                    if content != original_content:
                        with open(filepath, 'w', encoding='utf-8') as f:
                            f.write(content)
                        print(f"Repaired CMakeLists.txt: {filepath}")

        # 5. Fix board support package (BSP) compilation issues with ESP-IDF v5.3.2
        bsp_source = 'components/esp32_s3_touch_amoled_2_06/esp32_s3_touch_amoled_2_06.c'
        if os.path.exists(bsp_source):
            with open(bsp_source, 'r', encoding='utf-8') as f:
                content = f.read()
            
            original_content = content
            # Remove '.allow_pd = 0' as the power down flag does not exist in v5.3.x structs
            content = re.sub(r'\.allow_pd\s*=\s*[^,\n]*,?', '', content)
            # Replace 'CONFIG_I2C_MASTER_FREQUENCY' with hardcoded 400kHz frequency
            content = content.replace('CONFIG_I2C_MASTER_FREQUENCY', '400000')
            
            if content != original_content:
                with open(bsp_source, 'w', encoding='utf-8') as f:
                    f.write(content)
                print(f"Repaired board support package source file: {bsp_source}")

        # 6. Fix header include paths for esp-brookesia v0.5.0 restructuring
        for root, dirs, files in os.walk('.'):
            for file in files:
                if file.endswith('.h') or file.endswith('.hpp') or file.endswith('.cpp'):
                    filepath = os.path.join(root, file)
                    try:
                        with open(filepath, 'r', encoding='utf-8') as f:
                            content = f.read()
                    except UnicodeDecodeError:
                        continue
                    
                    modified = False
                    
                    # Update obsolete base context include to the new core structure
                    if 'systems/base/esp_brookesia_base_context.hpp' in content:
                        content = content.replace('systems/base/esp_brookesia_base_context.hpp', 'systems/core/esp_brookesia_core.hpp')
                        modified = True
                        
                    # Update other potential obsolete base headers
                    if 'systems/base/esp_brookesia_base_type.hpp' in content:
                        content = content.replace('systems/base/esp_brookesia_base_type.hpp', 'systems/core/esp_brookesia_core_type.hpp')
                        modified = True
                        
                    if 'systems/base/esp_brookesia_base_app.hpp' in content:
                        content = content.replace('systems/base/esp_brookesia_base_app.hpp', 'systems/core/esp_brookesia_core_app.hpp')
                        modified = True
                        
                    # Update BaseContext class name changes
                    if 'EspBrookesiaBaseContext' in content:
                        content = content.replace('EspBrookesiaBaseContext', 'EspBrookesiaCore')
                        modified = True

                    if modified:
                        with open(filepath, 'w', encoding='utf-8') as f:
                            f.write(content)
                        print(f"Fixed legacy brookesia header includes in {filepath}")

    - name: Clean up Calculator Component Directory
      run: rm -rf components/apps/brookesia_app_calculator

    - name: Ensure SPIFFS Directory Exists
      run: mkdir -p spiffs

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3.2
        target: esp32s3
        path: '.'

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-firmware-binaries
        path: |
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/*.bin
