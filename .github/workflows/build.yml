name: Build ESP32 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone Dependencies Manually
      run: |
        # Clone the required board support package
        rm -rf components/esp32_s3_touch_amoled_2_06
        git clone https://github.com/joaquimorg/esp32_s3_touch_amoled_2_06.git components/esp32_s3_touch_amoled_2_06
        
        # Clone the missing UI Framework
        rm -rf esp-brookesia
        git clone --recursive https://github.com/espressif/esp-brookesia.git esp-brookesia

    - name: Remove Outdated Lock File
      run: |
        rm -f dependencies.lock

    - name: Smart Repair of Component Manifests
      shell: python
      run: |
        import os
        import re

        workspace = os.environ['GITHUB_WORKSPACE'].replace('\\', '/')
        win_path1 = 'D:/Work/ESP32-S3-Touch-AMOLED'
        win_path2 = 'D:\\Work\\ESP32-S3-Touch-AMOLED'

        for root, dirs, files in os.walk('.'):
            for file in files:
                if file == 'idf_component.yml':
                    filepath = os.path.join(root, file)
                    with open(filepath, 'r', encoding='utf-8') as f:
                        lines = f.readlines()
                        
                    new_lines = []
                    modified = False
                    
                    for line in lines:
                        original_line = line
                        
                        # 1. Map the original author's local Windows paths to the current GitHub runner workspace
                        if win_path1 in line:
                            line = line.replace(win_path1, workspace)
                        if win_path2 in line:
                            line = line.replace(win_path2, workspace)
                            
                        # 2. Validate all override_paths. If a dependency points to a directory that doesn't exist,
                        # safely remove the override so the ESP-IDF compiler automatically downloads it from the registry.
                        if 'override_path' in line:
                            match = re.search(r'override_path\s*:\s*([^#\n]+)', line)
                            if match:
                                path_val = match.group(1).strip().strip('"').strip("'")
                                
                                # Resolve the absolute path
                                if os.path.isabs(path_val):
                                    full_path = path_val
                                else:
                                    full_path = os.path.abspath(os.path.join(root, path_val))
                                    
                                # Check if the folder actually exists on the runner
                                if not os.path.isdir(full_path):
                                    print(f"[{filepath}] Removing broken override_path: {path_val}")
                                    modified = True
                                    continue  # Skip adding this line to the new file
                                else:
                                    print(f"[{filepath}] Keeping valid override_path: {path_val}")
                        
                        if line != original_line:
                            modified = True
                        new_lines.append(line)
                        
                    if modified:
                        with open(filepath, 'w', encoding='utf-8') as f:
                            f.writelines(new_lines)

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3.1
        target: esp32s3
        path: '.'

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: esp32s3-firmware-binaries
        path: |
          build/bootloader/bootloader.bin
          build/partition_table/partition-table.bin
          build/*.bin
